name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Application
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/apex-studio"
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyCv2Yx9fdqXWtPktpntJieWc1CX9sAL-wE' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "apex-studio-852a4.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "apex-studio-852a4"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "apex-studio-852a4.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "933131690478"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:933131690478:web:3fce24220ee28ba5d7aeff"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: "G-YJZ284MG9J"
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "out"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
